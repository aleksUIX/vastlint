<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VASTlint · Analysis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    button { font-family: inherit; font-size: inherit; }

    :root {
      --bg:       #080e19;
      --bg2:      #0b1320;
      --bg3:      #0f1b2d;
      --border:   #1d2f47;
      --text:     #e8edf5;
      --text2:    #8aa7c8;
      --text3:    #3a5570;
      --blue:     #63b3ed;
      --red:      #ef5350;
      --yellow:   #ffb74d;
      --green:    #66bb6a;
      --xml-punct:   #4a7a9e;
      --xml-tag:     #569cd6;
      --xml-attr:    #9cdcfe;
      --xml-val:     #ce9178;
      --xml-comment: #6a9955;
      --xml-cdata:   #7ec8e3;
      --xml-pi:      #c586c0;
      --xml-text:    #c8d4e0;
      --xml-entity:  #f7c977;
    }

    html, body {
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    .topbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 24px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      height: 50px;
      flex-shrink: 0;
    }
    .logo { display: flex; align-items: center; gap: 9px; text-decoration: none; }
    .logo-icon {
      width: 28px; height: 28px; border-radius: 6px;
      border: 1px solid rgba(99,179,237,.2); background: var(--bg);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .logo-icon img { width: 22px; height: 22px; object-fit: contain; }
    .logo-name { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -.2px; }
    .logo-name span { color: var(--blue); }
    .topbar-divider { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
    .topbar-title { font-size: 12.5px; color: var(--text2); flex: 1; }
    .topbar-title strong { color: var(--text); font-weight: 600; }
    .topbar-pills { display: flex; gap: 6px; align-items: center; }
    .tpill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 5px; letter-spacing: .3px; }
    .tpill-err  { background: rgba(239,83,80,.15);  color: var(--red);    border: 1px solid rgba(239,83,80,.25); }
    .tpill-warn { background: rgba(255,183,77,.12);  color: var(--yellow); border: 1px solid rgba(255,183,77,.2); }
    .tpill-info { background: rgba(99,179,237,.1);   color: var(--blue);  border: 1px solid rgba(99,179,237,.2); }
    .tpill-ok   { background: rgba(102,187,106,.12); color: var(--green); border: 1px solid rgba(102,187,106,.2); }
    .ver-pill { font-size: 11px; color: var(--text3); background: rgba(99,179,237,.06); border: 1px solid rgba(99,179,237,.12); border-radius: 4px; padding: 2px 8px; }

    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: calc(100vh - 50px);
      width: 100%;
    }

    .pane-hdr {
      padding: 7px 20px;
      font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
      color: var(--text3); background: var(--bg2); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; height: 34px;
    }

    .pane-xml {
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border); background: var(--bg);
    }

    /* Syntax-highlight editor — textarea overlays a pre */
    .editor-wrap { flex: 1; position: relative; overflow: hidden; background: var(--bg); }

    .editor-wrap textarea,
    .editor-wrap pre {
      position: absolute; inset: 0; margin: 0;
      padding: 16px 20px;
      font: 400 12.5px/1.65 ui-monospace, "SF Mono", "Fira Code", monospace;
      tab-size: 2; white-space: pre-wrap; word-wrap: break-word;
      overflow: auto; border: none; outline: none;
    }

    /* Line-highlight layer — sits between bg and the pre */
    #xml-line-hl-wrap {
      position: absolute; inset: 0; z-index: 1;
      overflow: hidden; pointer-events: none; user-select: none;
    }
    #xml-line-hl-inner { position: relative; }
    .xl-line {
      position: absolute; left: 0; right: 0;
      height: 20.625px; /* 12.5px * 1.65 */
    }
    .xl-line.error   { background: rgba(239,83,80,.13);  border-left: 2px solid rgba(239,83,80,.55); }
    .xl-line.warning { background: rgba(255,183,77,.09); border-left: 2px solid rgba(255,183,77,.5); }
    .xl-line.info    { background: rgba(99,179,237,.08); border-left: 2px solid rgba(99,179,237,.4); }

    #xml-hl {
      z-index: 2; background: transparent; color: var(--xml-text);
      pointer-events: none; user-select: none;
    }
    #xml-hl code { font: inherit; }

    #xml-input {
      z-index: 3; background: transparent;
      color: transparent; caret-color: #8aa7c8;
      resize: none;
    }
    #xml-input::placeholder { -webkit-text-fill-color: var(--text3); color: var(--text3); }

    .xt-punct   { color: var(--xml-punct); }
    .xt-tag     { color: var(--xml-tag); font-weight: 500; }
    .xt-attr    { color: var(--xml-attr); }
    .xt-val     { color: var(--xml-val); }
    .xt-comment { color: var(--xml-comment); font-style: italic; }
    .xt-cdata   { color: var(--xml-cdata); }
    .xt-pi      { color: var(--xml-pi); }
    .xt-entity  { color: var(--xml-entity); }

    /* Squiggly underlines on issue tokens */
    .sq { text-decoration: underline wavy; text-underline-offset: 3px; text-decoration-skip-ink: none; }
    .sq-error   { text-decoration-color: rgba(239,68,68,.85); }
    .sq-warning { text-decoration-color: rgba(245,158,11,.85); }
    .sq-info    { text-decoration-color: rgba(129,140,248,.85); }

    /* Floating tooltip */
    #xml-tooltip {
      display: none; position: fixed; z-index: 1000;
      width: 320px; max-width: calc(100vw - 16px);
      background: #111827; border: 1px solid #374151;
      border-radius: 8px; padding: 0;
      box-shadow: 0 8px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
      pointer-events: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    .tip-row {
      padding: 10px 13px;
      border-bottom: 1px solid #1f2937;
      display: flex; flex-direction: column; gap: 4px;
    }
    .tip-row:last-child { border-bottom: none; }
    .tip-meta {
      display: flex; align-items: center; gap: 8px;
      font-family: ui-monospace, monospace; font-size: 10px;
    }
    .tip-id   { color: #60a5fa; text-decoration: none; }
    .tip-line { color: #6b7280; }
    .tip-msg  { font-size: 11.5px; font-weight: 500; color: #e5e7eb; line-height: 1.45; }

    .pane-xml-footer {
      padding: 7px 16px; background: var(--bg2); border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0; height: 38px;
    }
    #analyze-btn {
      padding: 5px 14px; border: 1px solid rgba(99,179,237,.3); border-radius: 6px;
      background: rgba(99,179,237,.1); color: var(--blue); font: 600 11.5px/1 system-ui;
      cursor: pointer; transition: background .12s, border-color .12s;
    }
    #analyze-btn:hover { background: rgba(99,179,237,.2); border-color: rgba(99,179,237,.5); }
    #analyze-btn:disabled { opacity: .45; cursor: default; }
    #analyzing-indicator { font-size: 11px; color: var(--text3); display: none; }
    #char-count { margin-left: auto; font-size: 10px; color: var(--text3); }

    .pane-results { display: flex; flex-direction: column; overflow: hidden; }

    .filter-bar {
      padding: 5px 16px; background: var(--bg2); border-bottom: 1px solid var(--border);
      display: none; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .filter-bar.visible { display: flex; }
    .filter-label { font-size: 10px; color: var(--text3); margin-right: 2px; }
    .filter-btn {
      padding: 2px 9px; border-radius: 4px; border: 1px solid transparent;
      background: none; font-size: 10px; font-weight: 700; cursor: pointer; letter-spacing: .3px;
      transition: background .1s, border-color .1s;
    }
    .filter-btn.err  { color: var(--red); }
    .filter-btn.warn { color: var(--yellow); }
    .filter-btn.info { color: var(--blue); }
    .filter-btn.active.err  { background: rgba(239,83,80,.12);  border-color: rgba(239,83,80,.3); }
    .filter-btn.active.warn { background: rgba(255,183,77,.1);  border-color: rgba(255,183,77,.25); }
    .filter-btn.active.info { background: rgba(99,179,237,.1);  border-color: rgba(99,179,237,.2); }
    .filter-btn:not(.active) { opacity: .4; }

    #results-empty, #loading-state, .clean-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
    }
    #results-empty { color: var(--text3); font-size: 13px; }
    #results-empty svg { opacity: .2; }
    #loading-state { color: var(--text3); font-size: 12px; display: none; }
    .clean-state { color: var(--green); font-size: 14px; font-weight: 600; }
    .clean-state .big { font-size: 40px; }

    .spinner {
      width: 20px; height: 20px; border: 2px solid var(--border);
      border-top-color: var(--blue); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #issue-list {
      flex: 1; overflow-y: auto; padding: 14px 16px;
      display: flex; flex-direction: column; gap: 16px;
      scrollbar-width: thin; scrollbar-color: var(--border) var(--bg);
    }

    .issue-group { display: flex; flex-direction: column; gap: 6px; }
    .issue-group-hdr {
      display: flex; align-items: center; gap: 8px;
      padding-bottom: 4px;
    }
    .sev-badge {
      display: inline-block; border-radius: 4px;
      padding: 2px 6px; font-size: 9.5px; font-weight: 700; letter-spacing: .6px;
    }
    .sev-badge-error   { background: rgba(239,68,68,.12);  color: #ef4444; border: 1px solid rgba(239,68,68,.3); }
    .sev-badge-warning { background: rgba(245,158,11,.1);  color: #f59e0b; border: 1px solid rgba(245,158,11,.3); }
    .sev-badge-info    { background: rgba(99,102,241,.1);  color: #818cf8; border: 1px solid rgba(99,102,241,.3); }
    .group-count { font-size: 10.5px; color: var(--text2); }

    .issue-group-items { display: flex; flex-direction: column; gap: 5px; }

    .issue-card {
      border-radius: 7px; padding: 9px 12px;
      display: flex; flex-direction: column; gap: 4px;
      transition: opacity .1s;
    }
    .issue-card.hidden { display: none; }
    .sev-error   .issue-card,
    .issue-card.sev-error   { border-left: 2px solid rgba(239,68,68,.5);   background: rgba(28,10,10,.7); }
    .sev-warning .issue-card,
    .issue-card.sev-warning { border-left: 2px solid rgba(245,158,11,.45); background: rgba(28,20,0,.7); }
    .sev-info    .issue-card,
    .issue-card.sev-info    { border-left: 2px solid rgba(99,102,241,.4);  background: rgba(14,14,28,.7); }

    .iss-meta {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
      font-family: ui-monospace, "SF Mono", monospace; font-size: 10px; color: var(--text2);
    }
    .iss-id { color: var(--text2); text-decoration: none; opacity: .8; }
    .iss-id:hover { opacity: 1; text-decoration: underline; color: var(--blue); }
    .iss-path { color: var(--text3); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .iss-line { color: var(--text3); }
    .iss-meta span + span::before { content: '·'; margin-right: 6px; color: var(--text3); }

    .iss-msg  { font-size: 12px; font-weight: 500; color: var(--text); line-height: 1.45; }
    .iss-spec { font-size: 10px; color: var(--text3); line-height: 1.5; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="logo" href="https://vastlint.org" target="_blank">
      <div class="logo-icon"><img src="../icons/icon128.png" alt="" /></div>
      <span class="logo-name">VAST<span>lint</span></span>
    </a>
    <div class="topbar-divider"></div>
    <div class="topbar-title" id="topbar-title">Paste VAST XML on the left to analyze</div>
    <div class="topbar-pills" id="topbar-pills"></div>
  </div>

  <div class="main">

    <div class="pane-xml">
      <div class="pane-hdr"><span>VAST XML</span></div>
      <div class="editor-wrap">
        <div id="xml-line-hl-wrap"><div id="xml-line-hl-inner"></div></div>
        <textarea id="xml-input" placeholder="Paste VAST XML here…" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
        <pre id="xml-hl" aria-hidden="true"><code id="xml-hl-code"></code></pre>
      </div>
      <div class="pane-xml-footer">
        <button id="analyze-btn">▶ Analyze</button>
        <span id="analyzing-indicator">Analyzing…</span>
        <span id="char-count"></span>
      </div>
    </div>

    <div class="pane-results">
      <div class="pane-hdr" id="results-hdr" style="display:none">
        <span id="results-hdr-label">Results</span>
      </div>

      <div class="filter-bar" id="filter-bar">
        <span class="filter-label">SHOW</span>
        <button class="filter-btn err  active" data-sev="error">✖ Errors</button>
        <button class="filter-btn warn active" data-sev="warning">⚠ Warnings</button>
        <button class="filter-btn info active" data-sev="info">ℹ Info</button>
      </div>

      <div id="loading-state">
        <div class="spinner"></div>
        <span>Analyzing…</span>
      </div>

      <div id="results-empty">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <span>Paste VAST XML on the left to analyze</span>
      </div>

      <div id="issue-list" style="display:none"></div>
      <div id="clean-state" class="clean-state" style="display:none">
        <span class="big">✓</span>
        <span>No issues found</span>
      </div>
    </div>

  </div>

  <div id="xml-tooltip"></div>
  <script src="analysis.js"></script>
</body>
</html>
