name: Release
'on':
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:
    inputs:
      npm_tag:
        description: Rebuild WASM and publish npm for this existing tag (e.g. v0.13.7). Leaves the rest of Release idle.
        type: string
        default: ''
        required: false
      tag:
        description: Existing core tag to republish, including SDKs and bindings
        type: string
        default: ''
        required: false
env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref_name }}
permissions:
  contents: read
jobs:
  smoke-test:
    name: Smoke test all modules
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.npm_tag == '' }}
    steps:
      - name: Skip smoke on tag republish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        run: echo "Skipping smoke for republish of ${RELEASE_TAG}; it ran when this tag was cut."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust toolchain
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
      - name: cargo build NIF
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: cargo build -p vastlint_nif
      - name: cargo test --workspace
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: cargo test --workspace --exclude vastlint_nif
      - name: Build CLI (release)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: cargo build --release -p vastlint-cli
      - name: 'CLI smoke : valid fixture exits 0'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: |
          ./target/release/vastlint check \
            crates/vastlint-core/tests/fixtures/valid_4.2.xml
          echo "Exit code: $?"
      - name: 'CLI smoke : invalid fixture exits 1'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "set +e\n./target/release/vastlint check \\\n  crates/vastlint-core/tests/fixtures/err_no_version.xml\nCODE=$?\n\
          set -e\nif [ \"$CODE\" -eq 0 ]; then\n  echo \"ERROR: vastlint exited 0 on an invalid fixture : expected non-zero\"\
          \n  exit 1\nfi\necho \"Exit code $CODE (expected non-zero) \u2713\"\n"
      - name: Install wasm-pack
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: cargo install wasm-pack --locked
      - name: Install Node.js
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Build WASM (nodejs target)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: wasm-pack build crates/vastlint-wasm --target nodejs --out-dir ../../npm/pkg-node
      - name: Build WASM (bundler target)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: wasm-pack build crates/vastlint-wasm --target bundler --out-dir ../../npm/pkg
      - name: Assemble npm package
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: node npm/scripts/assemble.js
      - name: 'WASM smoke : valid fixture returns no errors'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "node - <<'EOF'\nconst { validate } = require('./npm');\nconst fs = require('fs');\n\nconst validXml = fs.readFileSync(\n\
          \  'crates/vastlint-core/tests/fixtures/valid_4.2.xml', 'utf8'\n);\nconst result = validate(validXml);\nif (result.summary.errors\
          \ !== 0) {\n  console.error('WASM smoke FAILED: expected 0 errors on valid fixture, got', result.summary.errors);\n\
          \  process.exit(1);\n}\nif (!result.summary.valid) {\n  console.error('WASM smoke FAILED: expected valid=true on\
          \ valid fixture');\n  process.exit(1);\n}\nconsole.log('WASM valid fixture \u2713 (errors=0, valid=true)');\nEOF\n"
      - name: 'WASM smoke : invalid fixture returns errors'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "node - <<'EOF'\nconst { validate } = require('./npm');\nconst fs = require('fs');\n\nconst invalidXml = fs.readFileSync(\n\
          \  'crates/vastlint-core/tests/fixtures/err_no_version.xml', 'utf8'\n);\nconst result = validate(invalidXml);\n\
          if (result.summary.errors === 0) {\n  console.error('WASM smoke FAILED: expected errors > 0 on invalid fixture');\n\
          \  process.exit(1);\n}\nif (result.summary.valid) {\n  console.error('WASM smoke FAILED: expected valid=false on\
          \ invalid fixture');\n  process.exit(1);\n}\nconsole.log('WASM invalid fixture \u2713 (errors=' + result.summary.errors\
          \ + ', valid=false)');\nEOF\n"
      - name: 'CLI smoke : error rule IDs (JSON output)'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "FIXTURES=(\n  \"err_inline_missing_impression.xml:VAST-2.0-inline-impression\"\n  \"err_missing_adsystem.xml:VAST-2.0-inline-adsystem\"\
          \n  \"err_no_version.xml:VAST-2.0-root-version\"\n  \"err_missing_duration.xml:VAST-2.0-linear-duration\"\n  \"\
          err_mediafile_missing_attrs.xml:VAST-2.0-mediafile-delivery\"\n  \"err_wrapper_missing_vasttag.xml:VAST-2.0-wrapper-vastadtaguri\"\
          \n  \"err_adservingid_missing.xml:VAST-4.1-adservingid-present\"\n  \"err_universaladid_missing.xml:VAST-4.0-universaladid-present\"\
          \n  \"err_verification_vendor.xml:VAST-4.1-verification-vendor\"\n  \"err_companion_clicktracking_no_id.xml:VAST-4.0-companion-clicktracking-id\"\
          \n  \"err_icon_missing_resource.xml:VAST-3.0-icon-resource\"\n  \"err_progress_no_offset.xml:VAST-3.0-progress-offset\"\
          \n)\nPASS=0; FAIL=0\nfor ENTRY in \"${FIXTURES[@]}\"; do\n  FILE=\"${ENTRY%%:*}\"\n  RULE=\"${ENTRY##*:}\"\n  FIXTURE=\"\
          crates/vastlint-core/tests/fixtures/$FILE\"\n  OUTPUT=$(./target/release/vastlint check \"$FIXTURE\" --format json\
          \ 2>/dev/null || true)\n  if echo \"$OUTPUT\" | python3 -c \"import sys,json; d=json.load(sys.stdin); sys.exit(0\
          \ if any(i['id']=='$RULE' for i in d['issues']) else 1)\"; then\n    echo \"PASS [$FILE \u2192 $RULE]\"\n    PASS=$((PASS+1))\n\
          \  else\n    echo \"FAIL [$FILE \u2192 $RULE not found in issues]\"\n    echo \"  Output: $OUTPUT\" | head -5\n\
          \    FAIL=$((FAIL+1))\n  fi\ndone\necho \"Results: $PASS passed, $FAIL failed\"\n[ \"$FAIL\" -eq 0 ] || exit 1\n"
      - name: 'CLI smoke : warning and info rule IDs (JSON output)'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "FIXTURES=(\n  \"warn_vpaid.xml:VAST-4.1-vpaid-apiframework\"\n  \"warn_duplicate_impression.xml:VAST-2.0-duplicate-impression\"\
          \n  \"warn_version_mismatch.xml:VAST-2.0-version-mismatch\"\n  \"warn_flash_mediafile.xml:VAST-2.0-flash-mediafile\"\
          \n  \"warn_survey_deprecated.xml:VAST-4.1-survey-deprecated\"\n  \"warn_url_invalid.xml:VAST-2.0-url-invalid\"\n\
          \  \"warn_bitrate_conflict.xml:VAST-3.0-bitrate-conflict\"\n  \"warn_companion_renderingmode.xml:VAST-4.1-companion-renderingmode-value\"\
          \n  \"warn_tracking_event_unknown.xml:VAST-4.1-tracking-event-value\"\n  \"warn_adtype_invalid.xml:VAST-4.1-adtype-value\"\
          \n  \"warn_blockedadcategories_no_authority.xml:VAST-4.1-blockedadcategories-no-authority\"\n  \"warn_universaladid_idvalue_removed.xml:VAST-4.1-universaladid-idvalue-removed\"\
          \n  \"info_http_tracking.xml:VAST-2.0-tracking-https\"\n)\nPASS=0; FAIL=0\nfor ENTRY in \"${FIXTURES[@]}\"; do\n\
          \  FILE=\"${ENTRY%%:*}\"\n  RULE=\"${ENTRY##*:}\"\n  FIXTURE=\"crates/vastlint-core/tests/fixtures/$FILE\"\n  OUTPUT=$(./target/release/vastlint\
          \ check \"$FIXTURE\" --format json 2>/dev/null || true)\n  if echo \"$OUTPUT\" | python3 -c \"import sys,json; d=json.load(sys.stdin);\
          \ sys.exit(0 if any(i['id']=='$RULE' for i in d['issues']) else 1)\"; then\n    echo \"PASS [$FILE \u2192 $RULE]\"\
          \n    PASS=$((PASS+1))\n  else\n    echo \"FAIL [$FILE \u2192 $RULE not found in issues]\"\n    FAIL=$((FAIL+1))\n\
          \  fi\ndone\necho \"Results: $PASS passed, $FAIL failed\"\n[ \"$FAIL\" -eq 0 ] || exit 1\n"
      - name: 'CLI smoke : --vast-version upgrade fires 4.1 rules on 2.0 doc'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "# A plain VAST 2.0 document forced to 4.1 must:\n#   \u2022 report version \"4.1\" in JSON\n#   \u2022 fire\
          \ VAST-4.1-adservingid-present (missing on 2.0 doc)\ncat > /tmp/v2_simple.xml <<'XMLEOF'\n<VAST version=\"2.0\"\
          ><Ad id=\"1\"><InLine>\n  <AdSystem>Test</AdSystem><AdTitle>Test Ad</AdTitle>\n  <Impression><![CDATA[https://t.example.com/imp]]></Impression>\n\
          \  <Creatives><Creative><Linear>\n    <Duration>00:00:30</Duration>\n    <MediaFiles><MediaFile type=\"video/mp4\"\
          \ width=\"640\" height=\"480\" bitrate=\"500\" delivery=\"progressive\">\n      <![CDATA[https://cdn.example.com/ad.mp4]]>\n\
          \    </MediaFile></MediaFiles>\n  </Linear></Creative></Creatives>\n</InLine></Ad></VAST>\nXMLEOF\n\nOUTPUT=$(./target/release/vastlint\
          \ check /tmp/v2_simple.xml --vast-version 4.1 --format json 2>/dev/null || true)\n\nVERSION=$(echo \"$OUTPUT\" |\
          \ python3 -c \"import sys,json; print(json.load(sys.stdin)['version'])\")\nif [ \"$VERSION\" != \"4.1\" ]; then\n\
          \  echo \"FAIL: expected version=4.1 in JSON, got '$VERSION'\"\n  exit 1\nfi\necho \"PASS: version field is 4.1\
          \ \u2713\"\n\necho \"$OUTPUT\" | python3 -c \"import sys,json; d=json.load(sys.stdin); sys.exit(0 if any(i['id']=='VAST-4.1-adservingid-present'\
          \ for i in d['issues']) else 1)\" || {\n  echo \"FAIL: VAST-4.1-adservingid-present did not fire after --vast-version\
          \ 4.1 override\"\n  exit 1\n}\necho \"PASS: VAST-4.1-adservingid-present fires on forced 4.1 \u2713\"\n"
      - name: 'CLI smoke : --vast-version downgrade suppresses 4.x rules'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "# A VAST 4.1 document forced to 2.0 must NOT fire any 4.x-only rules.\nOUTPUT=$(./target/release/vastlint check\
          \ \\\n  crates/vastlint-core/tests/fixtures/valid_4.1.xml \\\n  --vast-version 2.0 --format json 2>/dev/null ||\
          \ true)\n\nHITS=$(echo \"$OUTPUT\" | python3 -c \"\nimport sys, json\nd = json.load(sys.stdin)\nbad = [i['id'] for\
          \ i in d['issues'] if i['id'].startswith('VAST-4.')]\nprint(len(bad), bad)\n\")\nCOUNT=$(echo \"$HITS\" | awk '{print\
          \ $1}')\nif [ \"$COUNT\" -ne 0 ]; then\n  echo \"FAIL: 4.x rules fired after --vast-version 2.0 downgrade: $HITS\"\
          \n  exit 1\nfi\necho \"PASS: no 4.x rules fired after downgrade \u2713\"\n"
      - name: 'CLI smoke : --vast-version invalid value exits non-zero'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "set +e\n./target/release/vastlint check \\\n  crates/vastlint-core/tests/fixtures/valid_4.2.xml \\\n  --vast-version\
          \ 9.9 >/dev/null 2>&1\nCODE=$?\nset -e\nif [ \"$CODE\" -eq 0 ]; then\n  echo \"FAIL: invalid --vast-version 9.9\
          \ should exit non-zero, got 0\"\n  exit 1\nfi\necho \"PASS: --vast-version 9.9 exits $CODE (non-zero) \u2713\"\n"
      - name: 'CLI smoke : --ignore-pattern suppresses macro URL errors'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "# A VAST with macro placeholders in URL fields fires url-empty/url-invalid\n# without the flag.  With --ignore-pattern\
          \ the macros are replaced before\n# validation and no URL errors should appear.\ncat > /tmp/vmacro.xml <<'XMLEOF'\n\
          <VAST version=\"4.2\"><Ad id=\"1\"><InLine>\n  <AdSystem>Acme DSP</AdSystem>\n  <AdServingId>srv-macro-01</AdServingId>\n\
          \  <AdTitle>Macro Test Ad</AdTitle>\n  <Impression><![CDATA[${IMP_URL}]]></Impression>\n  <Creatives><Creative>\n\
          \    <UniversalAdId idRegistry=\"Ad-ID\">mac01</UniversalAdId>\n    <Linear>\n      <Duration>00:00:30</Duration>\n\
          \      <TrackingEvents>\n        <Tracking event=\"start\"><![CDATA[%%TRACKER_START%%]]></Tracking>\n        <Tracking\
          \ event=\"firstQuartile\"><![CDATA[${Q1_URL}]]></Tracking>\n        <Tracking event=\"midpoint\"><![CDATA[${MID_URL}]]></Tracking>\n\
          \        <Tracking event=\"thirdQuartile\"><![CDATA[${Q3_URL}]]></Tracking>\n        <Tracking event=\"complete\"\
          ><![CDATA[${COMP_URL}]]></Tracking>\n      </TrackingEvents>\n      <MediaFiles><MediaFile type=\"video/mp4\" width=\"\
          1920\" height=\"1080\" bitrate=\"2000\" delivery=\"progressive\">\n        <![CDATA[https://cdn.example.com/hd.mp4]]>\n\
          \      </MediaFile></MediaFiles>\n    </Linear>\n  </Creative></Creatives>\n</InLine></Ad></VAST>\nXMLEOF\n\n# Without\
          \ flag: url-empty must fire\nURL_ISSUES=$(./target/release/vastlint check /tmp/vmacro.xml --format json 2>/dev/null\
          \ \\\n  | python3 -c \"import sys,json; d=json.load(sys.stdin); print([i['id'] for i in d['issues'] if 'url' in\
          \ i['id'].lower()])\" || true)\nif [ \"$URL_ISSUES\" = \"[]\" ]; then\n  echo \"FAIL: expected URL errors without\
          \ --ignore-pattern, got none\"\n  exit 1\nfi\necho \"PASS: URL errors present without flag: $URL_ISSUES \u2713\"\
          \n\n# With flag: no URL errors\nOUTPUT=$(./target/release/vastlint check /tmp/vmacro.xml \\\n  --ignore-pattern\
          \ '\\$\\{[^}]+\\}|%%[^%]+%%' \\\n  --format json 2>/dev/null || true)\nURL_ISSUES=$(echo \"$OUTPUT\" | python3 -c\
          \ \"import sys,json; d=json.load(sys.stdin); print([i['id'] for i in d['issues'] if 'url' in i['id'].lower()])\"\
          \ || true)\nif [ \"$URL_ISSUES\" != \"[]\" ]; then\n  echo \"FAIL: expected no URL errors with --ignore-pattern,\
          \ got: $URL_ISSUES\"\n  exit 1\nfi\necho \"PASS: no URL errors after --ignore-pattern replacement \u2713\"\n"
      - name: 'CLI smoke : --ignore-pattern invalid regex exits non-zero'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "set +e\n./target/release/vastlint check \\\n  crates/vastlint-core/tests/fixtures/valid_4.2.xml \\\n  --ignore-pattern\
          \ '[invalid' >/dev/null 2>&1\nCODE=$?\nset -e\nif [ \"$CODE\" -eq 0 ]; then\n  echo \"FAIL: invalid --ignore-pattern\
          \ should exit non-zero, got 0\"\n  exit 1\nfi\necho \"PASS: invalid --ignore-pattern exits $CODE (non-zero) \u2713\
          \"\n"
      - name: 'CLI smoke : fix subcommand upgrades HTTP to HTTPS'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "# A fixture with HTTP URLs: fix should exit 0 and output HTTPS URLs.\ncat > /tmp/http_vast.xml <<'XMLEOF'\n\
          <VAST version=\"2.0\"><Ad id=\"1\"><InLine>\n  <AdSystem>Test</AdSystem><AdTitle>Test Ad</AdTitle>\n  <Impression>http://t.example.com/imp</Impression>\n\
          \  <Creatives><Creative><Linear>\n    <Duration>00:00:30</Duration>\n    <MediaFiles><MediaFile type=\"video/mp4\"\
          \ width=\"640\" height=\"480\" bitrate=\"500\" delivery=\"progressive\">\n      http://cdn.example.com/ad.mp4\n\
          \    </MediaFile></MediaFiles>\n  </Linear></Creative></Creatives>\n</InLine></Ad></VAST>\nXMLEOF\n\n# Use stdin\
          \ mode (-) so the fixed XML is written to stdout, not in-place.\nif ! FIXED=$(./target/release/vastlint fix - <\
          \ /tmp/http_vast.xml 2>/dev/null); then\n  echo \"FAIL: fix subcommand exited non-zero\"\n  exit 1\nfi\necho \"\
          PASS: fix subcommand exits 0 \u2713\"\n\nif echo \"$FIXED\" | grep -q 'http://'; then\n  echo \"FAIL: fixed output\
          \ still contains http:// URLs\"\n  exit 1\nfi\necho \"PASS: no http:// in fixed output \u2713\"\n\nif ! echo \"\
          $FIXED\" | grep -q 'https://'; then\n  echo \"FAIL: fixed output has no https:// URLs\"\n  exit 1\nfi\necho \"PASS:\
          \ fixed output contains https:// \u2713\"\n"
      - name: 'CLI smoke : fix --dry-run exits 0 and does not modify file'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "cp crates/vastlint-core/tests/fixtures/valid_4.2.xml /tmp/dryrun_test.xml\n./target/release/vastlint fix /tmp/dryrun_test.xml\
          \ --dry-run > /dev/null 2>&1\nCODE=$?\nif [ \"$CODE\" -ne 0 ]; then\n  echo \"FAIL: fix --dry-run exited $CODE,\
          \ expected 0\"\n  exit 1\nfi\necho \"PASS: fix --dry-run exits 0 \u2713\"\n# File must be unmodified\nif ! diff\
          \ -q crates/vastlint-core/tests/fixtures/valid_4.2.xml /tmp/dryrun_test.xml > /dev/null; then\n  echo \"FAIL: --dry-run\
          \ modified the input file\"\n  exit 1\nfi\necho \"PASS: --dry-run did not modify input file \u2713\"\n"
      - name: "CLI smoke : daemon OTP protocol (valid XML \u2192 valid=true)"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "python3 - <<'PYEOF'\nimport subprocess, struct, json, sys\n\nVALID_XML = open('crates/vastlint-core/tests/fixtures/valid_4.2.xml').read()\n\
          INVALID_XML = open('crates/vastlint-core/tests/fixtures/err_no_version.xml').read()\n\ndef daemon_call(xml_str):\n\
          \    proc = subprocess.Popen(\n        ['./target/release/vastlint', 'daemon'],\n        stdin=subprocess.PIPE,\
          \ stdout=subprocess.PIPE, stderr=subprocess.DEVNULL\n    )\n    encoded = xml_str.encode('utf-8')\n    proc.stdin.write(struct.pack('>I',\
          \ len(encoded)) + encoded)\n    proc.stdin.close()\n    resp_len = struct.unpack('>I', proc.stdout.read(4))[0]\n\
          \    result = json.loads(proc.stdout.read(resp_len).decode('utf-8'))\n    proc.wait(timeout=5)\n    return result\n\
          \n# Valid fixture \u2192 valid=true, errors=0\nr = daemon_call(VALID_XML)\nassert r.get('valid') is True, f\"FAIL:\
          \ daemon valid fixture: expected valid=true, got {r}\"\nassert r.get('summary', {}).get('errors') == 0, f\"FAIL:\
          \ daemon valid fixture: expected errors=0, got {r}\"\nassert r.get('version') == '4.2', f\"FAIL: daemon valid fixture:\
          \ expected version=4.2, got {r.get('version')}\"\nprint(f\"PASS: daemon valid fixture \u2192 valid=true, errors=0,\
          \ version=4.2 \u2713\")\n\n# Invalid fixture \u2192 valid=false, errors>0\nr = daemon_call(INVALID_XML)\nassert\
          \ r.get('valid') is False, f\"FAIL: daemon invalid fixture: expected valid=false, got {r}\"\nassert r.get('summary',\
          \ {}).get('errors', 0) > 0, f\"FAIL: daemon invalid fixture: expected errors>0, got {r}\"\nprint(f\"PASS: daemon\
          \ invalid fixture \u2192 valid=false, errors={r['summary']['errors']} \u2713\")\n\n# Rule ID check via daemon\n\
          IMP_XML = open('crates/vastlint-core/tests/fixtures/err_inline_missing_impression.xml').read()\nr = daemon_call(IMP_XML)\n\
          ids = [i['id'] for i in r.get('issues', [])]\nassert 'VAST-2.0-inline-impression' in ids, f\"FAIL: daemon rule ID\
          \ check: VAST-2.0-inline-impression not in {ids}\"\nprint(f\"PASS: daemon rule ID VAST-2.0-inline-impression fires\
          \ correctly \u2713\")\n\nprint(\"All daemon smoke tests passed.\")\nPYEOF\n"
      - name: 'WASM smoke : specific error rule ID fires'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "node - <<'EOF'\nconst { validate } = require('./npm');\nconst fs = require('fs');\n\nconst FIXTURES = [\n  ['err_inline_missing_impression.xml',\
          \ 'VAST-2.0-inline-impression',  true],\n  ['err_adservingid_missing.xml',       'VAST-4.1-adservingid-present',\
          \ true],\n  ['err_missing_adsystem.xml',          'VAST-2.0-inline-adsystem',     true],\n];\n\nlet pass = 0, fail\
          \ = 0;\nfor (const [file, ruleId, expectFires] of FIXTURES) {\n  const xml = fs.readFileSync(`crates/vastlint-core/tests/fixtures/${file}`,\
          \ 'utf8');\n  const result = validate(xml);\n  const fires = result.issues.some(i => i.id === ruleId);\n  if (fires\
          \ === expectFires) {\n    console.log(`PASS [${file} \u2192 ${ruleId}]`);\n    pass++;\n  } else {\n    console.error(`FAIL\
          \ [${file} \u2192 ${ruleId}]: expected fires=${expectFires}, got ${fires}`);\n    fail++;\n  }\n}\nconsole.log(`Results:\
          \ ${pass} passed, ${fail} failed`);\nif (fail > 0) process.exit(1);\nEOF\n"
      - name: 'WASM smoke : warning fixture valid=true, warnings>0'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "node - <<'EOF'\nconst { validate } = require('./npm');\nconst fs = require('fs');\n\n// warn_vpaid.xml fires\
          \ VAST-4.1-vpaid-apiframework (Warning) : document\n// must be valid=true (no errors) but have warnings>0.\nconst\
          \ xml = fs.readFileSync('crates/vastlint-core/tests/fixtures/warn_vpaid.xml', 'utf8');\nconst result = validate(xml);\n\
          \nif (!result.summary.valid) {\n  console.error('FAIL: warn_vpaid.xml should be valid=true (warnings are not errors)');\n\
          \  process.exit(1);\n}\nconsole.log('PASS: warn_vpaid.xml valid=true \u2713');\n\nif (result.summary.warnings ===\
          \ 0) {\n  console.error('FAIL: warn_vpaid.xml should have warnings>0');\n  process.exit(1);\n}\nconsole.log(`PASS:\
          \ warn_vpaid.xml warnings=${result.summary.warnings} \u2713`);\n\nconst fires = result.issues.some(i => i.id ===\
          \ 'VAST-4.1-vpaid-apiframework');\nif (!fires) {\n  console.error('FAIL: VAST-4.1-vpaid-apiframework should fire\
          \ on warn_vpaid.xml');\n  console.error('Issues:', result.issues.map(i => i.id));\n  process.exit(1);\n}\nconsole.log('PASS:\
          \ VAST-4.1-vpaid-apiframework fires on warn_vpaid.xml \u2713');\nEOF\n"
      - name: 'WASM smoke : info fixture valid=true, errors=0'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "node - <<'EOF'\nconst { validate } = require('./npm');\nconst fs = require('fs');\n\n// info_http_tracking.xml\
          \ fires VAST-2.0-tracking-https at Info level.\n// Document must be valid=true and errors=0.\nconst xml = fs.readFileSync('crates/vastlint-core/tests/fixtures/info_http_tracking.xml',\
          \ 'utf8');\nconst result = validate(xml);\n\nif (!result.summary.valid) {\n  console.error('FAIL: info_http_tracking.xml\
          \ should be valid=true');\n  process.exit(1);\n}\nif (result.summary.errors !== 0) {\n  console.error('FAIL: info_http_tracking.xml\
          \ should have errors=0, got', result.summary.errors);\n  process.exit(1);\n}\nconst fires = result.issues.some(i\
          \ => i.id === 'VAST-2.0-tracking-https');\nif (!fires) {\n  console.error('FAIL: VAST-2.0-tracking-https should\
          \ fire on info_http_tracking.xml');\n  process.exit(1);\n}\nconsole.log(`PASS: info_http_tracking.xml valid=true,\
          \ errors=0, VAST-2.0-tracking-https fires \u2713`);\nEOF\n"
      - name: 'CLI smoke : default text format contains rule ID and severity'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: "# Default output (no --format flag) must print human-readable text\n# with at least the rule ID and \"error\"\
          \ for an error-level fixture.\nOUTPUT=$(./target/release/vastlint check \\\n  crates/vastlint-core/tests/fixtures/err_no_version.xml\
          \ 2>/dev/null || true)\nif ! echo \"$OUTPUT\" | grep -qi 'VAST-2\\.0-root-version\\|root-version\\|err_no_version';\
          \ then\n  echo \"FAIL: text output missing expected rule reference\"\n  echo \"Output was: $OUTPUT\"\n  exit 1\n\
          fi\nif ! echo \"$OUTPUT\" | grep -qi 'error'; then\n  echo \"FAIL: text output missing 'error' keyword\"\n  echo\
          \ \"Output was: $OUTPUT\"\n  exit 1\nfi\necho \"PASS: default text format contains rule ID and severity \u2713\"\
          \n"
  build-wasm:
    name: Build WASM npm package
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: 'Build WASM (bundler target : ESM)'
        run: wasm-pack build crates/vastlint-wasm --target bundler --out-dir ../../npm/pkg
      - name: 'Build WASM (nodejs target : CJS)'
        run: wasm-pack build crates/vastlint-wasm --target nodejs --out-dir ../../npm/pkg-node
      - name: Assemble npm package
        run: node npm/scripts/assemble.js
      - name: Upload assembled npm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wasm-npm-package
          path: npm/
          retention-days: 14
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: smoke-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: vastlint
            crate: vastlint-cli
            archive: vastlint-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary: vastlint
            crate: vastlint-cli
            archive: vastlint-linux-aarch64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: vastlint
            crate: vastlint-cli
            archive: vastlint-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: vastlint
            crate: vastlint-cli
            archive: vastlint-macos-aarch64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Bump crate versions to match git tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          for toml in crates/*/Cargo.toml; do
            # crate's own [package] version
            sed -i.bak -E "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" "$toml"
            # inter-crate path-dependency version pins, e.g. cli/mcp/wasm pin
            # vastlint-core = { path = "...", version = "X" }; path-only deps untouched
            sed -i.bak -E "s/(vastlint-[a-z-]+ = \{[^}]*version = \")[^\"]*(\")/\1${VERSION}\2/g" "$toml"
            rm "$toml.bak"
          done
          echo "Bumped all crates to ${VERSION}"
      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools
      - name: Set up cross toolchain (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8
        with:
          target: ${{ matrix.target }}
      - name: Build (cargo)
        run: cargo build --release --target ${{ matrix.target }} -p ${{ matrix.crate }}
      - name: Package
        run: |
          BINARY=target/${{ matrix.target }}/release/${{ matrix.binary }}
          tar czf "${{ matrix.archive }}" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
  build-ffi:
    name: Build FFI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: smoke-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            static: libvastlint.a
            shared: libvastlint.so
            archive: vastlint-ffi-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            static: libvastlint.a
            shared: libvastlint.so
            archive: vastlint-ffi-linux-aarch64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            static: libvastlint.a
            shared: libvastlint.dylib
            archive: vastlint-ffi-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            static: libvastlint.a
            shared: libvastlint.dylib
            archive: vastlint-ffi-macos-aarch64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install cross (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked
      - name: 'Build FFI crate (cross : Linux aarch64)'
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} -p vastlint-ffi
      - name: 'Build FFI crate (cargo : all others)'
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} -p vastlint-ffi
      - name: Package FFI artifacts
        run: |
          OUTDIR=target/${{ matrix.target }}/release
          STAGING=ffi-staging
          mkdir -p "$STAGING"

          # Header : same for all platforms, included in every tarball so
          # consumers get a self-contained package.
          cp crates/vastlint-ffi/vastlint.h "$STAGING/"

          # Static library : Rust outputs libvastlint_ffi.a (crate name with
          # underscores). Rename to libvastlint.a so consumers use a clean name.
          cp "$OUTDIR/libvastlint_ffi.a" "$STAGING/libvastlint.a"

          # Shared library : same rename convention.
          # matrix.shared is "libvastlint.so" or "libvastlint.dylib"; derive
          # the extension using bash parameter expansion (not Actions expression).
          SHARED="${{ matrix.shared }}"
          EXT="${SHARED##*.}"
          cp "$OUTDIR/libvastlint_ffi.${EXT}" "$STAGING/${SHARED}"

          tar czf ${{ matrix.archive }} -C "$STAGING" .
      - name: Upload FFI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
  build-nif:
    name: Build NIF ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: smoke-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            lib: libvastlint_nif.so
            archive: vastlint-nif-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            lib: libvastlint_nif.so
            archive: vastlint-nif-linux-aarch64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            lib: libvastlint_nif.dylib
            archive: vastlint-nif-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            lib: libvastlint_nif.dylib
            archive: vastlint-nif-macos-aarch64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install cross (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked
      - name: 'Build NIF crate (cross : Linux aarch64)'
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} -p vastlint_nif
      - name: 'Build NIF crate (cargo : all others)'
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} -p vastlint_nif
      - name: Package NIF artifact
        run: |
          OUTDIR=target/${{ matrix.target }}/release
          STAGING=nif-staging
          mkdir -p "$STAGING"

          # Rust names the output libvastlint_nif.{so,dylib}.
          LIB="${{ matrix.lib }}"
          cp "$OUTDIR/${LIB}" "$STAGING/${LIB}"

          tar czf ${{ matrix.archive }} -C "$STAGING" .
      - name: Upload NIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
  classify:
    name: Classify release
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.npm_tag == '' }}
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
      needs_approval: ${{ steps.bump.outputs.needs_approval }}
    steps:
      - name: Compare tag to previous version
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          needs_approval=true
          bump="unknown"

          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            C_MAJ="${BASH_REMATCH[1]}"
            C_MIN="${BASH_REMATCH[2]}"

            PREV=""
            while IFS= read -r t; do
              [ -z "$t" ] && continue
              tv="${t#v}"
              lowest=$(printf '%s\n%s\n' "$tv" "$VERSION" | sort -V | head -n1)
              if [ "$lowest" != "$tv" ] || [ "$tv" = "$VERSION" ]; then
                continue
              fi
              if [ -z "$PREV" ]; then
                PREV="$t"
                continue
              fi
              highest=$(printf '%s\n%s\n' "${PREV#v}" "$tv" | sort -V | tail -n1)
              if [ "$highest" = "$tv" ]; then
                PREV="$t"
              fi
            done < <(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
                --jq '.[].ref | sub("refs/tags/"; "")' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -vx "$TAG" \
              || true
            )

            if [ -n "$PREV" ]; then
              IFS=. read -r P_MAJ P_MIN _ <<< "${PREV#v}"
              if [ "$C_MAJ" != "$P_MAJ" ]; then
                bump="major"
              elif [ "$C_MIN" != "$P_MIN" ]; then
                bump="minor"
              else
                bump="patch"
                needs_approval=false
              fi
              echo "Previous tag ${PREV} -> ${TAG} (${bump})"
            else
              bump="initial"
              echo "No previous version tag; requiring approval"
            fi
          else
            echo "Ref ${TAG} is not vMAJOR.MINOR.PATCH; requiring approval"
          fi

          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          echo "needs_approval=${needs_approval}" >> "$GITHUB_OUTPUT"

  wait-for-approval:
    name: Approve release
    needs: [classify, smoke-test, build, build-ffi, build-nif, build-wasm]
    runs-on: ubuntu-latest
    # Only an explicit "false" from classify uses `patch`. Anything else
    # (true, empty, unknown) waits on `production`.
    environment: ${{ needs.classify.outputs.needs_approval == 'false' && 'patch' || 'production' }}
    steps:
      - run: echo "Release approved (${{ needs.classify.outputs.bump }}); publish jobs may proceed"

  approve:
    name: Release gate
    needs: [classify, wait-for-approval, smoke-test, build, build-ffi, build-nif, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release gate passed (${{ needs.classify.outputs.bump }})"

  release:
    name: Create GitHub Release
    needs: [approve, build, build-ffi, build-nif, build-wasm, build-abi]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release and upload assets

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog section for this release
        id: changelog
        run: |
          # Pull the section for this tag (e.g. "## [0.3.7]") from CHANGELOG.md.
          # Outputs everything between this heading and the next "## " heading.
          VERSION="${RELEASE_TAG#v}"
          BODY=$(awk "/^## \[?${VERSION}\]?/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="See [CHANGELOG.md](https://github.com/aleksUIX/vastlint/blob/main/CHANGELOG.md) for details."
          fi
          printf '%s\n' "$BODY" > /tmp/release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          this="${TAG#v}"
          highest=$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
              --jq '.[].ref | sub("refs/tags/"; "")' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | sort -V \
            | tail -n1
          )
          if [ "$this" = "$highest" ]; then
            latest_flag=(--latest)
          else
            latest_flag=(--latest=false)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md "${latest_flag[@]}"
          mapfile -t files < <(
            find artifacts -type f \
              ! -path '*/examples/*' \
              ! -path '*/pkg/*' \
              ! -path '*/pkg-node/*' \
              ! -path '*/scripts/*' \
              | sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release artifacts to upload"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # ── SLSA Build Level 3 provenance ──────────────────────────────────────────
  # Runs after the GitHub Release is created so a provenance failure never
  # marks the release job itself as failed.  Uses GitHub's native attestation
  # action (replaces slsa-github-generator which broke on ubuntu-latest runners
  # due to its external binary download step).
  #
  # Provenance is stored in GitHub's attestation store — verify with:
  #   gh attestation verify <file> --repo aleksUIX/vastlint
  provenance:
    name: SLSA provenance attestation
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # request OIDC token for Sigstore signing
      attestations: write  # write provenance to GitHub's attestation store

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: artifacts/*

  publish:
    name: Publish to crates.io
    needs: [approve, build]
    runs-on: ubuntu-latest
    # Set ENABLE_CRATES_PUBLISH to "true" in repo variables (Settings → Variables)
    # to enable publishing. Without it this job is skipped entirely.
    if: vars.ENABLE_CRATES_PUBLISH == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v (pinned SHA)
        with:
          toolchain: stable

      - name: Bump crate versions to match git tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          # Update every crate's Cargo.toml to the release version so that
          # `cargo publish` always publishes the tag version, not whatever was
          # last committed in Cargo.toml.
          for toml in crates/*/Cargo.toml; do
            # crate's own [package] version
            sed -i.bak -E "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" "$toml"
            # inter-crate path-dependency version pins, e.g. cli/mcp/wasm pin
            # vastlint-core = { path = "...", version = "X" }; path-only deps untouched
            sed -i.bak -E "s/(vastlint-[a-z-]+ = \{[^}]*version = \")[^\"]*(\")/\1${VERSION}\2/g" "$toml"
            rm "$toml.bak"
          done
          echo "Bumped all crates to ${VERSION}"

      # cargo publish refuses a dirty working tree, and the bump step above
      # dirties every Cargo.toml. Commit runner-locally (never pushed) so the
      # publish runs against a clean tree instead of failing with exit 101.
      #
      # The tree is already clean when the release commit carries the tag's
      # version, which RELEASE.md asks for. `git commit` exits 1 on nothing to
      # commit, so guard it: a clean tree is the state this step wants.
      - name: Commit version stamp (runner-local, never pushed)
        run: |
          git config user.name "vastlint-release"
          git config user.email "release@vastlint.org"
          if git diff --quiet; then
            echo "crate versions already match the tag, nothing to stamp"
          else
            git commit -am "release: stamp ${RELEASE_TAG#v} crate versions"
          fi

      - name: Publish vastlint-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          # Use crates.io API to check if this exact version is already published.
          # This is the only idempotency guard: any cargo publish failure below
          # must fail the job. (An earlier version treated cargo exit code 101
          # as "already published", but 101 is cargo's generic error code, so
          # real failures were silently swallowed for four releases.)
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: vastlint-release" \
            "https://crates.io/api/v1/crates/vastlint-core/${VERSION}")
          if [ "$HTTP" = "200" ]; then
            echo "vastlint-core ${VERSION} already published, skipping"
          else
            cargo publish -p vastlint-core
          fi

      # Wait for crates.io to index the core crate before publishing the CLI.
      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish vastlint-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: vastlint-release" \
            "https://crates.io/api/v1/crates/vastlint-cli/${VERSION}")
          if [ "$HTTP" = "200" ]; then
            echo "vastlint-cli ${VERSION} already published, skipping"
          else
            cargo publish -p vastlint-cli
          fi

  # ── Docker Hub ──────────────────────────────────────────────────────────────
  # Builds a multi-arch image (amd64 + arm64) and pushes to aleksuix/vastlint.
  #
  # Prerequisites (one-time setup):
  #   1. Create a repo named "vastlint" on hub.docker.com under aleksuix.
  #   2. Create a Docker Hub access token (Account Settings → Security).
  #   3. Add two secrets in this repo (Settings → Secrets → Actions):
  #        DOCKERHUB_USERNAME  — aleksuix
  #        DOCKERHUB_TOKEN     — the access token
  #
  # Set ENABLE_DOCKER_PUBLISH to "true" in repo variables to activate this job.
  publish-docker:
    name: Publish to Docker Hub
    needs: [approve, build]
    runs-on: ubuntu-latest
    if: vars.ENABLE_DOCKER_PUBLISH == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      # QEMU lets buildx cross-compile the arm64 layer on an amd64 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derive the plain semver version from the git tag (strips leading "v")
      - name: Derive version
        id: version
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            aleksuix/vastlint:latest
            aleksuix/vastlint:${{ steps.version.outputs.version }}
          # Use GitHub Actions cache instead of Docker Hub registry cache.
          # type=registry sourced from aleksuix/vastlint:buildcache was removed —
          # a compromised Docker Hub account could poison the cache layer and
          # inject malicious image layers into the build without detection.
          # type=gha is scoped to this repo and backed by GitHub's own cache
          # service; it cannot be written to by external parties.
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # The gRPC server ships as its own image rather than as a second
      # entrypoint on the CLI image. They have different runtime shapes, and one
      # image whose behaviour depends on an argument makes the exposed ports and
      # the health check conditional on something the orchestrator cannot see.
      - name: Build and push gRPC server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.grpc
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            aleksuix/vastlint-grpc:latest
            aleksuix/vastlint-grpc:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Buf Schema Registry ────────────────────────────────────────────────────
  # Publishes proto/openadtech/vastlint/v1 so consumers generate a client in any
  # language without vendoring the file. The fourteenth distribution channel,
  # built from the same single source of truth as the other thirteen.
  #
  # Prerequisites (one-time setup):
  #   1. Create the "open-adtech" organization on buf.build.
  #   2. Create a module named "vastlint" under it, so the full module name is
  #      buf.build/open-adtech/vastlint, matching buf.yaml. The hyphen is in the
  #      registry org only; the protobuf package stays openadtech.vastlint.v1,
  #      because those are different namespaces and renaming the package to
  #      match would be a breaking wire change for cosmetic symmetry.
  #   3. Create an API token (Settings -> API tokens) and add it as the
  #      BUF_TOKEN secret in this repo.
  #   4. Set ENABLE_BSR_PUBLISH to "true" in repo variables.
  #
  # Until then this job is skipped rather than failing, matching how the Docker
  # and npm jobs handle their own unset credentials.
  publish-proto:
    name: Publish to Buf Schema Registry
    needs: [approve, build]
    runs-on: ubuntu-latest
    if: vars.ENABLE_BSR_PUBLISH == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      # buf comes from the npm devDependency, the same version CI already lints
      # and breaking-checks with. Pulling a different buf here would mean the
      # thing that publishes the contract is not the thing that validated it.
      - name: Install buf
        run: npm ci

      # Publishing a contract that has not been checked would defeat the point
      # of checking it.
      - name: Verify the contract before publishing
        run: |
          npx buf lint
          npx buf format --diff --exit-code

      - name: Push to the registry
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: npx buf push --label "${RELEASE_TAG}"

  publish-npm:
    name: Publish to npm
    needs:
      - approve
      - build
      - build-wasm
    runs-on: ubuntu-latest
    if: vars.ENABLE_NPM_PUBLISH == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Download assembled npm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wasm-npm-package
          path: npm
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Prepare engine npm release package
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          VERSION="${TAG#v}"
          # Stage inside GITHUB_WORKSPACE so that npm's directory-tree lookup
          # finds the .npmrc written by setup-node (containing NODE_AUTH_TOKEN).
          node scripts/prepare-js-release-packages.mjs "$VERSION" "$GITHUB_WORKSPACE/.release/js-packages"
      - name: Publish JS packages to npm
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          VERSION="${TAG#v}"
          STAGE="$GITHUB_WORKSPACE/.release/js-packages"

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            # Write auth config directly in the staged parent directory so every
            # package publish runs with an explicit registry token.
            printf '%s\n' \
              "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" \
              'always-auth=true' \
              > "$STAGE/.npmrc"
            echo "Using NPM_TOKEN for publish (whoami is not required)"
          else
            echo "NPM_TOKEN not set; relying on npm trusted publishing via OIDC"
            unset NPM_CONFIG_USERCONFIG
          fi

          publish_if_needed() {
            local package_name="$1"
            local package_dir="$2"
            local extra=()

            if npm view "${package_name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${package_name}@${VERSION} already published; skipping"
              return 0
            fi

            latest=$(npm view "${package_name}" version 2>/dev/null || true)
            if [ -n "$latest" ] && [ "$VERSION" != "$latest" ]; then
              higher=$(printf '%s\n%s\n' "$VERSION" "$latest" | sort -V | tail -n1)
              if [ "$higher" = "$latest" ]; then
                extra=(--tag "archive-${VERSION}")
                echo "${package_name}@${VERSION} is older than latest ${latest}; using tag archive-${VERSION}"
              fi
            fi

            echo "Publishing ${package_name}@${VERSION} from ${package_dir}"
            if npm publish --provenance "${extra[@]}"; then
              return 0
            fi

            echo "Token publish failed; retrying with OIDC trusted publishing"
            rm -f "$STAGE/.npmrc"
            unset NODE_AUTH_TOKEN
            unset NPM_CONFIG_USERCONFIG
            npm publish --provenance "${extra[@]}"
          }

          pushd "$STAGE/vastlint" >/dev/null
          publish_if_needed "vastlint" "$PWD"
          popd >/dev/null
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  sync-go:
    name: Sync vastlint-go
    needs: [build-abi, release]
    runs-on: ubuntu-latest
    if: vars.ENABLE_GO_SYNC == 'true'

    steps:
      - name: Download the wasm engine module
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: vastlint-abi
          path: abi

      - name: Checkout vastlint-go via deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: aleksUIX/vastlint-go
          ssh-key: ${{ secrets.VASTLINT_GO_DEPLOY_KEY }}
          path: vastlint-go

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: vastlint-go/go.mod

      # vastlint-go embeds the engine as a wasm module pinned by SHA-256 and
      # refuses an engine whose version differs from ExpectedVersion. Both are
      # updated here, then its test suite checks the module against the golden
      # findings. A mismatch fails this job instead of pushing a broken binding.
      - name: Update the embedded engine
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          VERSION="${TAG#v}"
          cd vastlint-go
          if [[ ! -d internal/abi ]]; then
            echo "::error::vastlint-go does not have the engine layout (internal/abi); nothing synced"
            exit 1
          fi
          cp "../abi/vastlint-abi-${TAG}.wasm" internal/abi/vastlint_abi.wasm
          sha256sum internal/abi/vastlint_abi.wasm | cut -d' ' -f1 > internal/abi/vastlint_abi.wasm.sha256
          sed -i -E "s/^const ExpectedVersion = \"[^\"]*\"/const ExpectedVersion = \"${VERSION}\"/" vastlint.go
          grep -q "ExpectedVersion = \"${VERSION}\"" vastlint.go
          go test -count=1 ./...

      - name: Import bot GPG key
        run: |
          echo "${{ secrets.BOT_GPG_KEY }}" | gpg --batch --import
          # Trust the key fully so git can use it without prompts
          echo "AEA67F4C8B714AC26E14ACDB67DF23E270B033DB:6:" | gpg --import-ownertrust

      - name: Commit and push
        run: |
          TAG="${{ env.RELEASE_TAG }}"

          cd vastlint-go
          git config user.name  "vastlint release bot"
          git config user.email "bot@vastlint.org"
          git config user.signingkey "67DF23E270B033DB"
          git config commit.gpgsign  true

          git add internal/abi vastlint.go
          git diff --cached --quiet && echo "nothing to commit" && exit 0

          git commit -S -m "chore: engine ${TAG}"
          git push origin main

      - name: Tag vastlint-go
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          cd vastlint-go
          # Fail loudly if the tag already exists — never silently overwrite.
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "::warning::Tag $TAG already exists on vastlint-go — skipping tag push" && exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"

  # ── Sync vastlint-python ────────────────────────────────────────────────────
  # After a successful release, bump the version in the vastlint-python repo and
  # tag it at the same version. The vastlint-python publish workflow then runs
  # fetch-libs.sh against this release to vendor the shared libraries and pushes
  # the wheel to PyPI via trusted publishing.
  #
  # Prerequisites (one-time setup):
  #   1. Generate an SSH deploy key for vastlint-python:
  #        ssh-keygen -t ed25519 -f ~/VASTLINT_PYTHON_DEPLOY_KEY -C "vastlint release bot (python)" -N ""
  #   2. Add ~/VASTLINT_PYTHON_DEPLOY_KEY.pub as a deploy key in vastlint-python
  #      (Settings → Deploy keys) with write access.
  #   3. Add ~/VASTLINT_PYTHON_DEPLOY_KEY (private key) as secret
  #      VASTLINT_PYTHON_DEPLOY_KEY in this repo (Settings → Secrets → Actions).
  #
  # Set ENABLE_PYTHON_SYNC to "true" in repo variables to activate this job.
  sync-python:
    name: Sync vastlint-python
    needs:
      - release
    runs-on: ubuntu-latest
    if: vars.ENABLE_PYTHON_SYNC == 'true'
    steps:
      - name: Checkout vastlint-python via deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aleksUIX/vastlint-python
          ssh-key: ${{ secrets.VASTLINT_PYTHON_DEPLOY_KEY }}
          path: vastlint-python
      - name: Bump version
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          VERSION="${TAG#v}"
          cd vastlint-python
          printf '__version__ = "%s"\n' "$VERSION" > src/vastlint/_version.py
          echo "set __version__ = ${VERSION}"
      - name: Import bot GPG key
        run: |
          echo "${{ secrets.BOT_GPG_KEY }}" | gpg --batch --import
          # Trust the key fully so git can use it without prompts
          echo "AEA67F4C8B714AC26E14ACDB67DF23E270B033DB:6:" | gpg --import-ownertrust
      - name: Commit and push
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          cd vastlint-python
          git config user.name  "vastlint release bot"
          git config user.email "bot@vastlint.org"
          git config user.signingkey "67DF23E270B033DB"
          git config commit.gpgsign  true

          git add src/vastlint/_version.py
          if git diff --cached --quiet; then
            echo "version already at ${TAG#v} : nothing to commit"
          else
            git commit -S -m "chore: release ${TAG}"
            git push origin main
          fi
      - name: Tag vastlint-python
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          cd vastlint-python
          # Fail loudly if the tag already exists : never silently overwrite.
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "::warning::Tag $TAG already exists on vastlint-python : skipping tag push" && exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
  sync-java:
    name: Sync vastlint-java
    needs: [release]
    runs-on: ubuntu-latest
    if: vars.ENABLE_JAVA_SYNC == 'true'

    steps:
      - name: Checkout vastlint proto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: vastlint

      - name: Checkout vastlint-java via deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: aleksUIX/vastlint-java
          ssh-key: ${{ secrets.VASTLINT_JAVA_DEPLOY_KEY }}
          path: vastlint-java

      - name: Vendor proto and bump version
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          VERSION="${TAG#v}"
          DEST=vastlint-java/src/main/proto/openadtech/vastlint/v1/vastlint.proto
          mkdir -p "$(dirname "$DEST")"
          cp vastlint/proto/openadtech/vastlint/v1/vastlint.proto "$DEST"
          sh vastlint-java/scripts/inject-java-options.sh "$DEST"
          sed -i "s/^version=.*/version=${VERSION}/" vastlint-java/gradle.properties
          echo "set version = ${VERSION}"

      - name: Import bot GPG key
        run: |
          echo "${{ secrets.BOT_GPG_KEY }}" | gpg --batch --import
          echo "AEA67F4C8B714AC26E14ACDB67DF23E270B033DB:6:" | gpg --import-ownertrust

      - name: Commit and push
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          cd vastlint-java
          git config user.name  "vastlint release bot"
          git config user.email "bot@vastlint.org"
          git config user.signingkey "67DF23E270B033DB"
          git config commit.gpgsign  true

          git add src/main/proto gradle.properties
          if git diff --cached --quiet; then
            echo "already at ${TAG}: nothing to commit"
          else
            git commit -S -m "chore: sync proto to ${TAG}"
            git push origin main
          fi

      - name: Tag vastlint-java
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          cd vastlint-java
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "::warning::Tag $TAG already exists on vastlint-java, skipping tag push" && exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"

  # ── Chrome Web Store ────────────────────────────────────────────────────────
  sync-erlang:
    name: Sync vastlint-erlang
    needs:
      - build-nif
      - release
    runs-on: ubuntu-latest
    if: vars.ENABLE_ERLANG_SYNC == 'true'
    steps:
      - name: Download all NIF artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: nif-artifacts
          pattern: vastlint-nif-*
          merge-multiple: true
      - name: Checkout vastlint-erlang via deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aleksUIX/vastlint-erlang
          ssh-key: ${{ secrets.VASTLINT_DEPLOY_KEY }}
          path: vastlint-erlang
      - name: Update mix.exs version
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          VERSION="${TAG#v}"
          sed -i "s/@version \"[^\"]*\"/@version \"${VERSION}\"/" \
            vastlint-erlang/mix.exs
          echo "Updated mix.exs to ${VERSION}"
      - name: Regenerate checksum file
        run: |
          CHECKSUM_FILE="vastlint-erlang/checksum-Elixir.VastlintNif.exs"

          # Write a fresh checksum map.  RustlerPrecompiled resolves tarballs by
          # the base_url + filename convention; keys must match exactly.
          echo '%{' > "$CHECKSUM_FILE"

          for TARBALL in nif-artifacts/vastlint-nif-*.tar.gz; do
            BASENAME=$(basename "$TARBALL")
            SHA256=$(sha256sum "$TARBALL" | awk '{print $1}')
            echo "  \"${BASENAME}\" => \"sha256:${SHA256}\"," >> "$CHECKSUM_FILE"
          done

          echo '}' >> "$CHECKSUM_FILE"
          echo "Wrote $CHECKSUM_FILE"
          cat "$CHECKSUM_FILE"
      - name: Import bot GPG key
        run: |
          echo "${{ secrets.BOT_GPG_KEY }}" | gpg --batch --import
          echo "AEA67F4C8B714AC26E14ACDB67DF23E270B033DB:6:" | gpg --import-ownertrust
      - name: Commit and push
        run: |
          TAG="${{ env.RELEASE_TAG }}"

          cd vastlint-erlang
          git config user.name  "vastlint release bot"
          git config user.email "bot@vastlint.org"
          git config user.signingkey "67DF23E270B033DB"
          git config commit.gpgsign  true

          git add mix.exs checksum-Elixir.VastlintNif.exs
          git diff --cached --quiet && echo "nothing to commit" && exit 0

          git commit -S -m "chore: update prebuilt NIFs to ${TAG}"
          git push origin main
      - name: Tag vastlint-erlang
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          cd vastlint-erlang
          # Fail loudly if the tag already exists : never silently overwrite.
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "::warning::Tag $TAG already exists on vastlint-erlang : skipping tag push" && exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
  sync-infra:
    name: Sync vastlint-infra
    needs: [publish-npm, release]
    runs-on: ubuntu-latest
    if: vars.ENABLE_INFRA_SYNC == 'true'

    steps:
      - name: Checkout vastlint-infra via deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: aleksUIX/vastlint-infra
          ssh-key: ${{ secrets.VASTLINT_INFRA_DEPLOY_KEY }}
          path: vastlint-infra

      - name: Bump vastlint npm dependency to release version
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          VERSION="${TAG#v}"

          # Update both the workspace root and the web app package.json
          for PKG in "package.json" "apps/vastlint-web/package.json"; do
            FILE="vastlint-infra/$PKG"
            if [[ -f "$FILE" ]]; then
              # Use node to update the version to avoid sed quoting issues
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('$FILE', 'utf8'));
                const updated = { ...pkg };
                for (const section of ['dependencies', 'devDependencies']) {
                  if (updated[section]?.vastlint !== undefined) {
                    updated[section].vastlint = '$VERSION';
                  }
                }
                fs.writeFileSync('$FILE', JSON.stringify(updated, null, 2) + '\n');
              "
              echo "Bumped vastlint in $PKG to ${VERSION}"
            fi
          done

      - name: Import bot GPG key
        run: |
          echo "${{ secrets.BOT_GPG_KEY }}" | gpg --batch --import
          echo "AEA67F4C8B714AC26E14ACDB67DF23E270B033DB:6:" | gpg --import-ownertrust

      - name: Commit and push
        run: |
          TAG="${{ env.RELEASE_TAG }}"

          cd vastlint-infra
          git config user.name  "vastlint release bot"
          git config user.email "bot@vastlint.org"
          git config user.signingkey "67DF23E270B033DB"
          git config commit.gpgsign  true

          git add package.json apps/vastlint-web/package.json
          git diff --cached --quiet && echo "nothing to commit" && exit 0

          git commit -S -m "chore: bump vastlint npm dependency to ${TAG}"
          git push origin main

  # ── Sync homebrew-tap ───────────────────────────────────────────────────────
  # After a successful CLI release, update the Homebrew formula in
  # aleksUIX/homebrew-tap so the versioned URLs and all four platform SHA-256
  # values always match the tarballs produced by this workflow run.
  #
  # Prerequisites (one-time setup):
  #   1. Generate an SSH deploy key for homebrew-tap:
  #        ssh-keygen -t ed25519 -f ~/VASTLINT_HOMEBREW_TAP_DEPLOY_KEY -C "vastlint release bot (homebrew)" -N ""
  #   2. Add ~/VASTLINT_HOMEBREW_TAP_DEPLOY_KEY.pub as a deploy key in
  #      aleksUIX/homebrew-tap (Settings → Deploy keys) with write access.
  #   3. Add ~/VASTLINT_HOMEBREW_TAP_DEPLOY_KEY (private key) as secret
  #      VASTLINT_HOMEBREW_TAP_DEPLOY_KEY in this repo
  #      (Settings → Secrets → Actions).
  #
  # Set ENABLE_HOMEBREW_TAP_SYNC to "true" in repo variables to activate this
  # job.
  sync-homebrew-tap:
    name: Sync homebrew-tap
    needs: [build, release]
    runs-on: ubuntu-latest
    if: vars.ENABLE_HOMEBREW_TAP_SYNC == 'true'

    steps:
      - name: Download CLI release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: cli-artifacts
          pattern: vastlint-*.tar.gz
          merge-multiple: true

      - name: Checkout homebrew-tap via deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: aleksUIX/homebrew-tap
          ssh-key: ${{ secrets.VASTLINT_HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Update vastlint formula version and checksums
        env:
          TAG: ${{ env.RELEASE_TAG }}
          FORMULA: homebrew-tap/Formula/vastlint.rb
        run: |
          VERSION="${TAG#v}"

          declare -A ARCHIVES=(
            [SHA_MACOS_ARM64]=vastlint-macos-aarch64.tar.gz
            [SHA_MACOS_X86_64]=vastlint-macos-x86_64.tar.gz
            [SHA_LINUX_ARM64]=vastlint-linux-aarch64.tar.gz
            [SHA_LINUX_X86_64]=vastlint-linux-x86_64.tar.gz
          )

          for KEY in "${!ARCHIVES[@]}"; do
            FILE="cli-artifacts/${ARCHIVES[$KEY]}"
            if [[ ! -f "$FILE" ]]; then
              echo "Missing expected CLI archive: $FILE"
              exit 1
            fi
            VALUE=$(sha256sum "$FILE" | awk '{print $1}')
            export "$KEY=$VALUE"
            echo "${ARCHIVES[$KEY]} => $VALUE"
          done

          export VERSION

          ruby <<'RUBY'
          formula_path = ENV.fetch('FORMULA')
          version = ENV.fetch('VERSION')
          replacements = {
            'vastlint-macos-aarch64.tar.gz' => ENV.fetch('SHA_MACOS_ARM64'),
            'vastlint-macos-x86_64.tar.gz' => ENV.fetch('SHA_MACOS_X86_64'),
            'vastlint-linux-aarch64.tar.gz' => ENV.fetch('SHA_LINUX_ARM64'),
            'vastlint-linux-x86_64.tar.gz' => ENV.fetch('SHA_LINUX_X86_64'),
          }

          content = File.read(formula_path)
          content = content.sub(/version\s+"[^"]+"/, "version \"#{version}\"")

          replacements.each do |archive, checksum|
            pattern = %r{(url "https://github\.com/aleksUIX/vastlint/releases/download/)v[^/]+(/#{Regexp.escape(archive)}"\n\s+sha256 ")([0-9a-f]{64})(")}
            updated = content.sub(pattern) do
              "#{$1}v#{version}#{$2}#{checksum}#{$4}"
            end
            if updated == content
              raise "failed to update #{archive} in #{formula_path}"
            end
            content = updated
          end

          File.write(formula_path, content)
          RUBY

      - name: Validate formula syntax
        run: ruby -c homebrew-tap/Formula/vastlint.rb

      - name: Import bot GPG key
        run: |
          echo "${{ secrets.BOT_GPG_KEY }}" | gpg --batch --import
          echo "AEA67F4C8B714AC26E14ACDB67DF23E270B033DB:6:" | gpg --import-ownertrust

      - name: Commit and push
        run: |
          TAG="${{ env.RELEASE_TAG }}"

          cd homebrew-tap
          git config user.name  "vastlint release bot"
          git config user.email "bot@vastlint.org"
          git config user.signingkey "67DF23E270B033DB"
          git config commit.gpgsign true

          git add Formula/vastlint.rb
          git diff --cached --quiet && echo "nothing to commit" && exit 0

          git commit -S -m "chore: update vastlint formula to ${TAG}"
          git push origin main

  # Recovery: rebuild WASM and publish npm for an existing tag, using this
  # workflow file so npm trusted publishing (OIDC) matches the publisher
  # bound to release.yml. A dead NPM_TOKEN must not block that path.
  publish-npm-recovery:
    name: Publish to npm (tag recovery)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.npm_tag }}
      - name: Validate tag
        env:
          TAG: ${{ inputs.npm_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be vMAJOR.MINOR.PATCH, got '${TAG}'"
            exit 1
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Build WASM (bundler target, ESM)
        run: wasm-pack build crates/vastlint-wasm --target bundler --out-dir ../../npm/pkg
      - name: Build WASM (nodejs target, CJS)
        run: wasm-pack build crates/vastlint-wasm --target nodejs --out-dir ../../npm/pkg-node
      - name: Assemble npm package
        run: node npm/scripts/assemble.js
      - name: Prepare engine npm release package
        env:
          TAG: ${{ inputs.npm_tag }}
        run: |
          VERSION="${TAG#v}"
          node scripts/prepare-js-release-packages.mjs "$VERSION" "$GITHUB_WORKSPACE/.release/js-packages"
      - name: Publish JS packages to npm
        env:
          TAG: ${{ inputs.npm_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          STAGE="$GITHUB_WORKSPACE/.release/js-packages"

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '%s\n' \
              "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" \
              'always-auth=true' \
              > "$STAGE/.npmrc"
            echo "Using NPM_TOKEN for publish (whoami is not required)"
          else
            echo "NPM_TOKEN not set; relying on npm trusted publishing via OIDC"
            unset NPM_CONFIG_USERCONFIG
          fi

          publish_if_needed() {
            local package_name="$1"
            local extra=()

            if npm view "${package_name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${package_name}@${VERSION} already published; skipping"
              return 0
            fi

            latest=$(npm view "${package_name}" version 2>/dev/null || true)
            if [ -n "$latest" ] && [ "$VERSION" != "$latest" ]; then
              higher=$(printf '%s\n%s\n' "$VERSION" "$latest" | sort -V | tail -n1)
              if [ "$higher" = "$latest" ]; then
                extra=(--tag "archive-${VERSION}")
                echo "${package_name}@${VERSION} is older than latest ${latest}; using tag archive-${VERSION}"
              fi
            fi

            echo "Publishing ${package_name}@${VERSION}"
            if npm publish --provenance "${extra[@]}"; then
              return 0
            fi

            echo "Token publish failed; retrying with OIDC trusted publishing"
            rm -f "$STAGE/.npmrc"
            unset NODE_AUTH_TOKEN
            unset NPM_CONFIG_USERCONFIG
            npm publish --provenance "${extra[@]}"
          }

          pushd "$STAGE/vastlint" >/dev/null
          publish_if_needed "vastlint"
          popd >/dev/null
  build-abi:
    name: Build wasm engine module
    runs-on: ubuntu-latest
    needs: smoke-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v (pinned SHA)
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Bump crate versions to match git tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          for toml in crates/*/Cargo.toml; do
            sed -i.bak -E "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" "$toml"
            sed -i.bak -E "s/(vastlint-[a-z-]+ = \{[^}]*version = \")[^\"]*(\")/\1${VERSION}\2/g" "$toml"
            rm "$toml.bak"
          done

      - name: Build the module
        run: |
          RUSTFLAGS="-C target-feature=+simd128" \
            cargo build --profile release-wasm --target wasm32-unknown-unknown -p vastlint-abi

      - name: Package the module
        run: |
          TAG="${RELEASE_TAG}"
          mkdir -p abi-staging
          cp target/wasm32-unknown-unknown/release-wasm/vastlint_abi.wasm "abi-staging/vastlint-abi-${TAG}.wasm"
          (cd abi-staging && sha256sum "vastlint-abi-${TAG}.wasm" > "vastlint-abi-${TAG}.wasm.sha256")
          ls -la abi-staging

      - name: Upload the module
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vastlint-abi
          path: abi-staging/
          retention-days: 14
