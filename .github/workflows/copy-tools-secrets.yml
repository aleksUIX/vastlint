# One-off: seal the application publishing secrets for aleksUIX/vastlint-tools.
# Values are encrypted on the runner with that repository's Actions public key,
# so only GitHub can decrypt them. Delete this branch after the copy.
name: Copy tools secrets

on:
  push:
    branches: [chore/copy-tools-secrets]

permissions: {}

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Seal secrets for vastlint-tools
        env:
          TARGET_KEY: Aahwt6s8075ip2BhejJo7Ab5FAAqbGBrtooDi21uVSw=
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check pynacl==1.5.0
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import base64, json, os
          from nacl import encoding, public
          box = public.SealedBox(public.PublicKey(os.environ["TARGET_KEY"].encode(), encoding.Base64Encoder()))
          names = ["CHROME_EXTENSION_ID", "CHROME_CLIENT_ID", "CHROME_CLIENT_SECRET", "CHROME_REFRESH_TOKEN",
                   "VSCE_PAT", "OVSX_TOKEN", "SMITHERY_API_KEY", "NPM_TOKEN"]
          sealed = {}
          for name in names:
              value = os.environ.get(name, "")
              sealed[name] = base64.b64encode(box.encrypt(value.encode())).decode() if value else None
          print("SEALED " + json.dumps(sealed, separators=(",", ":")))
          PY
