name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Default every job to read-only. Jobs that need more declare it explicitly.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v (pinned SHA)
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write  # rustsec/audit-check posts check-run annotations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v (pinned SHA)
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: cargo build
        run: cargo build --all

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0

  mcp-smoke:
    name: MCP smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v (pinned SHA)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Build vastlint-mcp
        run: cargo build --release -p vastlint-mcp

      - name: MCP smoke — initialize + tools/list returns 7 tools
        run: |
          RESPONSE=$(
            (
              echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'
              sleep 0.2
              echo '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'
              sleep 0.2
              echo '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
              sleep 1
            ) | ./target/release/vastlint-mcp 2>/dev/null
          )

          # capabilities must include tools
          echo "$RESPONSE" | grep -q '"tools"' || {
            echo "FAIL: initialize response missing tools capability"
            echo "$RESPONSE"
            exit 1
          }
          echo "capabilities.tools present ✓"

          # tools/list must return exactly 7 tools
          TOOL_COUNT=$(echo "$RESPONSE" | grep '"tools":\[' | grep -o '"name":"' | wc -l | tr -d ' ')
          if [ "$TOOL_COUNT" -ne 7 ]; then
            echo "FAIL: expected 7 tools, got $TOOL_COUNT"
            echo "$RESPONSE"
            exit 1
          fi
          echo "tools/list returned $TOOL_COUNT tools ✓"

          # each expected tool must be present
          for TOOL in validate_vast validate_vast_url fix_vast list_rules explain_rule inspect_vast; do
            echo "$RESPONSE" | grep -q "\"$TOOL\"" || {
              echo "FAIL: tool '$TOOL' missing from tools/list"
              echo "$RESPONSE"
              exit 1
            }
            echo "  $TOOL ✓"
          done

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v (pinned SHA)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: cargo doc
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  proto:
    name: Proto contract
    runs-on: ubuntu-latest
    steps:
      # buf breaking compares this commit against the tip of main, so the job
      # needs real history rather than the default shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      # buf comes from the npm devDependency rather than buf-setup-action, so
      # the version is pinned by package-lock.json and the workflow takes on no
      # additional third-party action.
      - name: Install buf
        run: npm ci

      - name: buf lint
        run: npx buf lint

      - name: buf format check
        run: npx buf format --diff --exit-code

      # The backward-compatibility gate. Any change to a published field number,
      # field type, enum value, or RPC signature fails here rather than being
      # caught by a consumer after release.
      #
      # Skipped on pushes to main, where the comparison target is the commit
      # itself.
      #
      # The guard exists for exactly one PR: the one that introduces the
      # contract. buf exits non-zero with "had no .proto files" when the
      # comparison target has none, which would make the introducing PR red for
      # a reason that is not a compatibility problem. Once main carries a proto
      # the branch is always taken, so this cannot quietly disable the gate
      # later: it would take deleting every .proto from main to skip it again.
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: |
          if ! git ls-tree -r --name-only origin/main | grep -q '\.proto$'; then
            echo "main carries no .proto files yet, so there is no prior contract to"
            echo "break. This branch should only be reachable on the PR that first"
            echo "adds the contract."
            exit 0
          fi

          # buf resolves `branch=main` against a local branch, and checkout
          # leaves the PR in a detached HEAD with only origin/main present, so
          # the clone fails with "could not clone .git: exit status 128". The
          # fetch creates the local branch buf is looking for. This did not show
          # up on the pull request that introduced the contract, because the
          # guard above short-circuited before buf ever ran.
          git fetch --no-tags origin main:main
          npx buf breaking --against '.git#branch=main'

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # Both images are built here and pushed nowhere. Until now the only thing
      # that ever built them was a release, so a Dockerfile that no longer
      # compiles would surface in the middle of publishing rather than on the
      # pull request that broke it. Two other gates failed that way this week
      # (cargo publish on a dev-dependency, and buf breaking with no prior
      # contract), which is enough of a pattern to close this one deliberately.
      #
      # linux/amd64 only. The release builds amd64 and arm64 through QEMU, which
      # roughly doubles the time for a second architecture that cannot fail
      # independently here: the binary is a statically linked musl build with no
      # architecture-specific code, and its dependencies are the same on both.
      # Paying that on every pull request would buy very little.
      - name: Build the CLI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the gRPC server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.grpc
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write  # upload SARIF results to GitHub Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@66b39da20ccc656acc90dd27ea30f5d458ec33ce  # v3.28.19
        with:
          languages: rust
          queries: security-and-quality

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v (pinned SHA)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Build for CodeQL
        run: cargo build --all

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@66b39da20ccc656acc90dd27ea30f5d458ec33ce  # v3.28.19
        with:
          category: rust

  # ── Fuzz (short-circuit run) ─────────────────────────────────────────────────
  # Runs each libFuzzer target for a short burst on every CI push/PR to catch
  # regressions early. The full OSS-Fuzz integration runs continuously in the
  # background; this job gives fast feedback without the OSS-Fuzz latency.
  #
  # Each target runs for 30 seconds — long enough to exercise many paths but
  # short enough not to block the CI queue.  The corpus/ directories are seeded
  # with representative valid and invalid VAST XML from the test fixtures so the
  # fuzzer starts from a useful state rather than from scratch every run.
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [validate, fix, validate_wrapper]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v (pinned SHA)
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Seed corpus from test fixtures
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp crates/vastlint-core/tests/fixtures/*.xml fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true

      - name: Run fuzzer (30 s)
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} \
            -- -max_total_time=30 -timeout=10
