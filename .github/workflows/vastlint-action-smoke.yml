name: vastlint-action-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/vastlint-action-smoke.yml'
      - 'crates/vastlint-core/tests/fixtures/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vastlint-action-smoke.yml'
      - 'crates/vastlint-core/tests/fixtures/**'

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test published vastlint-action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Valid fixture should pass
        uses: aleksUIX/vastlint-action@4fdc6d48830825458c018a943d8bb74e54cd6dd3  # v1
        with:
          path: crates/vastlint-core/tests/fixtures/valid_4.2.xml
          version: latest

      - name: Invalid fixture should fail
        id: invalid
        continue-on-error: true
        uses: aleksUIX/vastlint-action@4fdc6d48830825458c018a943d8bb74e54cd6dd3  # v1
        with:
          path: crates/vastlint-core/tests/fixtures/err_no_version.xml
          version: latest

      - name: Assert invalid fixture failed as expected
        shell: bash
        run: |
          if [[ "${{ steps.invalid.outcome }}" != "failure" ]]; then
            echo "Expected invalid fixture step to fail, got: ${{ steps.invalid.outcome }}"
            exit 1
          fi
