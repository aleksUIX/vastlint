name: Publish npm (manual)
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.13.7)
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be vMAJOR.MINOR.PATCH, got '${TAG}'"
            exit 1
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Build WASM (bundler target, ESM)
        run: wasm-pack build crates/vastlint-wasm --target bundler --out-dir ../../npm/pkg
      - name: Build WASM (nodejs target, CJS)
        run: wasm-pack build crates/vastlint-wasm --target nodejs --out-dir ../../npm/pkg-node
      - name: Assemble npm package
        run: node npm/scripts/assemble.js
      - name: Prepare engine npm release package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          node scripts/prepare-js-release-packages.mjs "$VERSION" "$GITHUB_WORKSPACE/.release/js-packages"
      - name: Publish JS packages to npm
        env:
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          STAGE="$GITHUB_WORKSPACE/.release/js-packages"

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '%s\n' \
              "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" \
              'always-auth=true' \
              > "$STAGE/.npmrc"
            echo "Using NPM_TOKEN for publish (whoami is not required)"
          else
            echo "NPM_TOKEN not set; relying on npm trusted publishing via OIDC"
            unset NPM_CONFIG_USERCONFIG
          fi

          publish_if_needed() {
            local package_name="$1"

            if npm view "${package_name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${package_name}@${VERSION} already published; skipping"
              return 0
            fi

            echo "Publishing ${package_name}@${VERSION}"
            if npm publish --provenance; then
              return 0
            fi

            echo "Token publish failed; retrying with OIDC trusted publishing"
            rm -f "$STAGE/.npmrc"
            unset NODE_AUTH_TOKEN
            unset NPM_CONFIG_USERCONFIG
            npm publish --provenance
          }

          pushd "$STAGE/vastlint" >/dev/null
          publish_if_needed "vastlint"
          popd >/dev/null
