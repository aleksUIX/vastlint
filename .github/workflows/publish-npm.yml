# Manual npm publish for an existing release tag.
#
# Recovery tool: the Release workflow publishes vastlint, vastlint-client, and
# vastlint-react on tag push. If that job is skipped or fails (v0.13.5 lost its
# wasm artifact after a 45h production wait; v0.13.6 and v0.13.7 skipped every
# publish job because the patch path skipped wait-for-approval), this workflow
# rebuilds the WASM package and publishes for a given tag.
#
# Usage: Actions tab, "Publish npm (manual)", enter the tag (e.g. v0.13.7),
# or: gh workflow run publish-npm.yml -f tag=v0.13.7

name: Publish npm (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.13.7)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be vMAJOR.MINOR.PATCH, got '${TAG}'"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v (pinned SHA)
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Build WASM (bundler target, ESM)
        run: wasm-pack build crates/vastlint-wasm --target bundler --out-dir ../../npm/pkg

      - name: Build WASM (nodejs target, CJS)
        run: wasm-pack build crates/vastlint-wasm --target nodejs --out-dir ../../npm/pkg-node

      - name: Assemble npm package
        run: node npm/scripts/assemble.js

      - name: Prepare JS release packages
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          node scripts/prepare-js-release-packages.mjs "$VERSION" "$GITHUB_WORKSPACE/.release/js-packages"

      - name: Publish JS packages to npm
        env:
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          STAGE="$GITHUB_WORKSPACE/.release/js-packages"

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '%s\n' \
              "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" \
              'always-auth=true' \
              > "$STAGE/.npmrc"

            pushd "$STAGE" >/dev/null
            npm whoami >/dev/null
            echo "Authenticated to npm as $(npm whoami) via NPM_TOKEN"
            popd >/dev/null
          else
            echo "NPM_TOKEN not set; relying on npm trusted publishing via OIDC"
          fi

          publish_if_needed() {
            local package_name="$1"

            if npm view "${package_name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${package_name}@${VERSION} already published; skipping"
              return 0
            fi

            echo "Publishing ${package_name}@${VERSION}"
            npm publish --provenance
          }

          pushd "$STAGE/vastlint" >/dev/null
          publish_if_needed "vastlint"
          popd >/dev/null

          pushd "$STAGE/vastlint-client" >/dev/null
          publish_if_needed "vastlint-client"
          popd >/dev/null

          pushd "$STAGE/vastlint-react" >/dev/null
          publish_if_needed "vastlint-react"
          popd >/dev/null
