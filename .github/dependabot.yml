version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: UTC
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - rust
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: UTC
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - github-actions
- package-ecosystem: npm
  directory: /npm
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: UTC
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - javascript
