version: v2

modules:
  - path: proto
    # The registry org is "open-adtech" with a hyphen. The proto package stays
    # openadtech.vastlint.v1 without one: a BSR module name and a protobuf
    # package are different namespaces with different rules, and renaming the
    # package to match would be a breaking wire change for cosmetic symmetry.
    name: buf.build/open-adtech/vastlint

lint:
  use:
    - STANDARD
    # Every declaration carries a comment. This file is the only documentation a
    # consumer who generates a client and never reads the Rust will ever see.
    - COMMENTS
  except:
    # Covered by COMMENTS on the enum itself. Requiring a comment on every enum
    # value produces restatements of the value name, which is noise.
    - COMMENT_ENUM_VALUE
    - COMMENT_FIELD
    - COMMENT_RPC

breaking:
  use:
    - FILE
