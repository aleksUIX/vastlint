[package]
name = "vastlint-core"
version = "0.6.2"
edition = "2021"
rust-version = "1.86"
authors = ["Aleks <aleks@vastlint.org>"]
description = "VAST XML validator, SIMID linter, OMID validator, and VPAID detector — IAB VAST 2.0–4.3, 129 rules, zero runtime dependencies"
license = "Apache-2.0"
repository = "https://github.com/aleksUIX/vastlint"
homepage = "https://vastlint.org"
readme = "../../README.md"
keywords = ["vast", "xml", "validator", "simid", "ctv"]
categories = ["parser-implementations", "development-tools"]

[dependencies]
quick-xml = { version = "0.40", features = [] }
url = "2"
phf = { version = "0.13", features = ["macros"] }

[dev-dependencies]
