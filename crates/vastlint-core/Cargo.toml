[package]
name = "vastlint-core"
version = "0.11.4"
edition = "2021"
rust-version = "1.86"
authors = ["Aleks <aleks@vastlint.org>"]
description = "VAST XML validator, SIMID linter, OMID validator, and VPAID detector. IAB VAST 2.0–4.4, 220 rules, pure Rust"
license = "Apache-2.0"
repository = "https://github.com/aleksUIX/vastlint"
homepage = "https://vastlint.org"
readme = "../../README.md"
keywords = ["vast", "xml", "validator", "simid", "ctv"]
categories = ["parser-implementations", "development-tools"]

[dependencies]
quick-xml = { version = "0.41", features = [] }
url = "2"
phf = { version = "0.14", features = ["macros"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "validate"
harness = false
