[package]
name = "vastlint-core"
version = "0.3.3"
edition = "2021"
rust-version = "1.86"
authors = ["Aleks <aleks@vastlint.org>"]
description = "VAST XML validator core — checks tags against IAB VAST 2.0 through 4.3"
license = "Apache-2.0"
repository = "https://github.com/aleksUIX/vastlint"
homepage = "https://github.com/aleksUIX/vastlint"
readme = "../../README.md"
keywords = ["vast", "xml", "validator", "adtech", "iab"]
categories = ["parser-implementations", "development-tools"]

[dependencies]
quick-xml = { version = "0.37", features = [] }
url = "2"
phf = { version = "0.13", features = ["macros"] }

[dev-dependencies]
