[package]
name = "vastlint-cli"
version = "0.11.8"
edition = "2021"
rust-version = "1.86"
authors = ["Aleks <aleks@vastlint.org>"]
description = "VAST XML validator and inspector — validate, inspect wrapper chains, and auto-fix IAB VAST 2.0–4.4 ad tags"
license = "Apache-2.0"
repository = "https://github.com/aleksUIX/vastlint"
homepage = "https://vastlint.org"
readme = "../../README.md"
keywords = ["vast", "xml", "validator", "simid", "ctv"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "vastlint"
path = "src/main.rs"

[dependencies]
vastlint-core = { path = "../vastlint-core", version = "0.11.8" }
# High-throughput allocator — eliminates system-allocator contention when
# validating many large VAST documents concurrently (see vastlint-core docs).
mimalloc = { version = "0.1", default-features = false }
# Argument parsing
clap = { version = "4", features = ["derive"] }
# Coloured terminal output
anstream = "1.0"
anstyle = "1"
# Config file parsing
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
# Opt-in telemetry ping (rustls, no OpenSSL dependency)
ureq = { version = "2", default-features = false, features = ["tls"] }
# Template placeholder replacement for --ignore-pattern
regex = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
# The gRPC surface, so the conformance test can compare the two surfaces
# directly. This test lives here rather than in vastlint-grpc because cargo only
# exposes CARGO_BIN_EXE_* for a package's own binaries, and comparing against a
# copy of the CLI's JSON writer would prove nothing.
vastlint-grpc = { path = "../vastlint-grpc", version = "0.11.7" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = "0.14"
