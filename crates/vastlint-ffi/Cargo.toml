[package]
name = "vastlint-ffi"
version = "0.2.6"
edition = "2021"
rust-version = "1.75"
authors = ["Aleks <aleks@vastlint.org>"]
description = "C FFI bindings for vastlint-core — foundation for Go, Ruby, Java, and other language bindings"
license = "Apache-2.0"
repository = "https://github.com/aleksUIX/vastlint"
homepage = "https://github.com/aleksUIX/vastlint"
keywords = ["vast", "xml", "validator", "adtech", "ffi"]
categories = ["external-ffi-bindings", "development-tools"]

[lib]
# cdylib  → .so / .dylib / .dll  — for runtime linking (Go CGo, Ruby, Python ctypes)
# staticlib → .a                 — for static linking (Go CGo with CGO_ENABLED=1, embedded)
crate-type = ["cdylib", "staticlib"]

[dependencies]
vastlint-core = { path = "../vastlint-core" }
mimalloc = { version = "0.1", default-features = false }
