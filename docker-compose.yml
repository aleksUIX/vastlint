# docker-compose.yml: local build and test helper
#
# CLI:
#   docker compose build vastlint
#   docker compose run --rm vastlint check /data/tag.xml
#   cat tag.xml | docker compose run --rm -T vastlint check -
#
# gRPC (what vastlint-java talks to):
#   docker compose up grpc
#   grpcurl -plaintext localhost:50051 list
#
# Partner tallies (Prometheus + Grafana on the same sidecar):
#   docker compose --profile pipeline up --build
#   open http://localhost:3000
#
# Published image, no local build:
#   docker run --rm -p 50051:50051 -p 9090:9090 aleksuix/vastlint-grpc:0.13.2

services:
  vastlint:
    build:
      context: .
      dockerfile: Dockerfile
    image: vastlint:local
    volumes:
      - ./scratch:/data:ro
    stdin_open: true
    tty: false

  grpc:
    build:
      context: .
      dockerfile: Dockerfile.grpc
    image: vastlint-grpc:local
    ports:
      - "50051:50051"
      - "9090:9090"
    environment:
      VASTLINT_GRPC_ADDR: 0.0.0.0:50051
      VASTLINT_METRICS_ADDR: 0.0.0.0:9090

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["pipeline"]
    depends_on:
      - grpc
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/pipeline/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["pipeline"]
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./deploy/pipeline/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/pipeline/grafana/dashboards:/var/lib/grafana/dashboards:ro
