[workspace]
members = [
    "crates/vastlint-abi",
    "crates/vastlint-cli",
    "crates/vastlint-core",
    "crates/vastlint-ffi",
    "crates/vastlint-grpc",
    "crates/vastlint-mcp",
    "crates/vastlint-nif",
    "crates/vastlint-wasm",
]
exclude = ["scratch/bench-core", "fuzz"]
resolver = "2"

[workspace.package]
rust-version = "1.91"

# Tests inherit this profile. Keep routine builds small across release worktrees.
[profile.dev]
debug = 0
incremental = false

# Release artifacts are linked into other processes (Go via cgo, the JVM, Erlang)
# and shipped as wasm. Whole-program optimisation keeps the native library near
# 1 MB of code. Panics keep unwinding so the FFI boundary can catch them.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# The wasm32 ABI module has no host to unwind into: a panic is a trap either
# way, so abort drops the unwinding machinery and shrinks the blob.
[profile.release-wasm]
inherits = "release"
panic = "abort"
