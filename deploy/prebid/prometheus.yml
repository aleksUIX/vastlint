global:
  scrape_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: prebid-server
    static_configs:
      - targets: ["pbs.internal:9091"]
        labels:
          cluster: video-east
          environment: staging
  - job_name: vastlint
    static_configs:
      - targets: ["vastlint.internal:9090"]
        labels:
          cluster: video-east
          environment: staging
